# PR meta gate -- enforces branch naming + PR title format.
#
# Pairs with the repo's "Squash and merge only" setting: the PR title becomes
# the squash commit message on main, so enforcing it here gives us a clean
# history without dictating individual local commit messages.
#
# Required status checks (in branch protection):
#   - branch-name
#   - pr-title
name: PR meta

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Check pattern
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(SYS-REQ-[0-9]+(-[a-z0-9-]+)?|chore/.+)$ ]]; then
            echo "::error::Branch name '$BRANCH' must match SYS-REQ-{number}[-description] (SYS-REQ-linked work) or chore/{description} (non-req housekeeping)"
            echo ""
            echo "Examples that pass:"
            echo "  SYS-REQ-12"
            echo "  SYS-REQ-12-add-nav-goal"
            echo "  chore/fix-typo-in-readme"
            echo "  chore/bump-cyclonedds-dep"
            echo ""
            echo "Examples that fail:"
            echo "  feature/vlm             (wrong prefix)"
            echo "  SYS-REQ-Add-Nav         (no number)"
            echo "  sys-req-12              (lowercase prefix)"
            echo "  SYS-REQ-12-Add-Nav      (description must be lowercase kebab)"
            exit 1
          fi
          echo "Branch name OK: $BRANCH"

  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Check pattern
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Format: ([SYS-REQ-{number}] | [chore]) <type>(<scope>)?: <lowercase subject>
          # Type set follows Conventional Commits.
          # Regex held in a variable so backslash-escaped literals survive bash parsing.
          re='^(\[SYS-REQ-[0-9]+\]|\[chore\]) (feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: [a-z].+$'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title '$TITLE' must match: ([SYS-REQ-{number}] | [chore]) <type>(<scope>)?: <lowercase subject>"
            echo ""
            echo "Examples that pass:"
            echo "  [SYS-REQ-12] feat(nav): add nav goal consumer"
            echo "  [SYS-REQ-7] fix(speech): drop stale barge-in flag"
            echo "  [SYS-REQ-99] chore(ci): tighten branch regex"
            echo "  [chore] docs(readme): fix typo in install section"
            echo "  [chore] chore(deps): bump dependency"
            echo ""
            echo "Examples that fail:"
            echo "  feat(nav): add consumer           (missing [SYS-REQ-{n}] prefix)"
            echo "  SYS-REQ-12 feat(nav): add ...     (missing brackets)"
            echo "  [SYS-REQ-12] Feat(nav): add ...   (type must be one of: feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)"
            echo "  [SYS-REQ-12] feat(Nav): add ...   (scope must be lowercase)"
            echo "  [SYS-REQ-12] feat(nav): Add ...   (subject first char must be lowercase -- mid-subject acronyms like VLM are OK)"
            exit 1
          fi
          echo "PR title OK: $TITLE"
