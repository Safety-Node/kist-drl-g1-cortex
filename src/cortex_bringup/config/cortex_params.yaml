# Shared parameters for the cortex node graph.
# Topic names on /bridge/* must match what the onboard stack publishes on the
# shared DDS bridge domain (post-comm_bridge redesign).

stt_node:
  ros__parameters:
    # /bridge/* names follow the ICD; kist-ext-sensor-io owns the publisher.
    # If that repo lands on different names, change them here — not in code.
    audio_topic: /bridge/sensors/audio_pcm
    speaker_state_topic: /bridge/audio/speaker_state   # comm_bridge outbound (was /bridge/sensors/* — mismatch)
    estop_topic: /bridge/safety/estop
    transcript_topic: /cortex/stt/transcript
    backend: google_cloud        # google_cloud | dummy (dummy needs no credentials)
    language_code: ko-KR
    sample_rate_hz: 16000        # AudioPCM locked format
    interim_results: false       # false = publish only is_final transcripts
    highpass_hz: 120.0           # removes low-freq vibration / DC
    lowpass_hz: 5500.0           # preserves Korean fricatives (ㅅ/ㅎ/ㅊ)
    input_gain_db: 0.0           # amplifying in a noisy room backfires
    echo_cancel_tail_ms: 200     # mute this long after SpeakerState.playing clears
    echo_cancel_lead_ms: 0       # pre-mute; needs a tts->stt onset signal, so off

tts_node:
  ros__parameters:
    say_topic: /cortex/tts/say          # ActionCmd (orchestrator -> tts)
    barge_in_topic: /cortex/tts/stop
    audio_out_topic: /bridge/cmd/audio_out
    estop_topic: /bridge/safety/estop
    backend: naver_clova
    language_code: ko-KR
    sample_rate_hz: 16000        # wire format (PC resamples — REQ-29)
    clova_sample_rate_hz: 24000  # Clova native request rate
    voice: nara
    speed: 0                     # Clova [-5, +5]
    request_timeout_s: 5.0       # on timeout: log + drop, no retry

orchestrator_node:
  ros__parameters:
    # scenario_dir: default = installed share/cortex_cognition/scenarios.
    # Override to point at a source dir during development.
    transcript_topic: /cortex/stt/transcript
    status_topic: /cortex/task_status
    verdict_topic: /cortex/critic/verdict
    active_subtask_topic: /cortex/active_subtask
    say_topic: /cortex/tts/say
    stop_topic: /cortex/tts/stop        # must match tts_node.barge_in_topic
    tick_rate_hz: 10.0
    # --- planner mode: THE switch between file scenarios and LLM planning.
    #   static  transcripts match scenario triggers[] (config/scenarios/*.json5)
    #   llm     every final transcript goes to llm_node; its Plan (same schema)
    #           is validated by the same loader and run by the same engine
    planner_mode: static                # static | llm — edit before launch
    llm_request_topic: /cortex/llm/request
    llm_plan_topic: /cortex/llm/plan
    llm_timeout_s: 20.0                 # utterance -> plan budget (llm mode)
    vla_prompt_topic: /cortex/vla/prompt  # must match vlm_node.vla_prompt_topic
    # Precondition gate (모든 sub-task에 사용 가능).
    #   grounded vla 스텝 있음: grounding VLM 호출에 합승, vla 발사만 게이트.
    #   없음(nav 등): 전용 판정(PreconditionReport), on_start 전체를 유예.
    #   false = SHADOW (기본): unmet 판정을 경고 로그로만 남기고 진행한다.
    #   true  = ENFORCE: unmet이면 sub-task를 즉시 실패시킨다.
    # shadow 로그와 실제 결과(timeout 여부)의 상관을 확인한 뒤에만 true로 올릴 것.
    precondition_enforce: false
    precondition_report_topic: /cortex/precondition/report
    # 비-grounded 판정 대기 상한. 넘기면 fail-open으로 그냥 출발한다 —
    # vlm_node가 죽어도 VLM이 필요 없는 이동이 발이 묶이면 안 된다.
    precondition_timeout_s: 3.0

vlm_node:
  ros__parameters:
    image_topic: /bridge/sensors/camera/color
    active_subtask_topic: /cortex/active_subtask
    verdict_topic: /cortex/critic/verdict
    vla_prompt_topic: /cortex/vla/prompt   # grounded prompts -> orchestrator
    precondition_report_topic: /cortex/precondition/report  # 비-grounded 전제 판정
    # VLA policy task_progress. Publisher = kist-vla-inference (its runner
    # currently DROPS action.task_progress — wiring it up is tracked in the
    # ICD; until then progress-gated sub-tasks simply never get judged and
    # fail on their own timeout, which is the safe direction).
    progress_topic: /cortex/vla/task_progress
    period_sec: 1.0

llm_node:
  ros__parameters:
    request_topic: /cortex/llm/request   # must match orchestrator llm_* topics
    plan_topic: /cortex/llm/plan
    backend: dummy                       # dummy | openai (openai not wired yet)
    model: gpt-4o
    request_timeout_s: 20.0

gui_bridge_node:
  ros__parameters:
    # ROS -> WebSocket egress to the display renderer (kist-drl-g1-gui, REQ-41).
    # Point the renderer at ws://<this-host>:8081 (its ?ws= query param).
    status_topic: /cortex/task_status
    camera_topic: /bridge/sensors/camera/color/compressed
    camera_transport: compressed   # compressed (forward JPEG) | raw (encode) | none
    ws_host: 0.0.0.0
    ws_port: 8081                   # GUIBackground default — must match renderer
    stream_rate_hz: 15.0
